<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Wesley's stuffed lion teddy beside a Bitcoin coin">
  <!-- Soft ground shadow under both -->
  <ellipse cx="160" cy="208" rx="145" ry="6" fill="#2d2a26" opacity="0.12"/>

  <!-- Bitcoin coin (right side) -->
  <g>
    <circle cx="232" cy="125" r="68" fill="#f0d59c"/>
    <circle cx="232" cy="125" r="64" fill="#f7e3b3" opacity="0.7"/>
    <circle cx="232" cy="125" r="68" fill="none" stroke="#c98f3d" stroke-width="2" opacity="0.5"/>
    <text x="232" y="148" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="74" font-weight="700" fill="#b8852a">₿</text>
  </g>

  <!-- Lion teddy: symmetric sitting plush, mane just touches the coin -->
  <g>
    <!-- Tail behind body, curling out to the left with tufted tip -->
    <path d="M 80 178 C 50 178 26 162 28 130"
          stroke="#d9a55c" stroke-width="10" stroke-linecap="round" fill="none"/>
    <g transform="translate(28 130)">
      <circle r="12" fill="#c98f3d"/>
      <circle cx="-6" cy="-5" r="7" fill="#b8852a"/>
      <circle cx="5" cy="-3" r="6" fill="#b8852a"/>
      <circle cx="0" cy="6" r="5" fill="#b8852a"/>
    </g>

    <!-- Body -->
    <ellipse cx="112" cy="158" rx="48" ry="34" fill="#d9a55c"/>
    <!-- Tummy patch -->
    <ellipse cx="112" cy="166" rx="28" ry="22" fill="#f5d8a8"/>

    <!-- Splayed front legs / paw pads facing the viewer -->
    <g>
      <ellipse cx="80" cy="190" rx="22" ry="14" fill="#d9a55c"/>
      <ellipse cx="80" cy="194" rx="14" ry="7" fill="#f5d8a8"/>
      <ellipse cx="80" cy="195" rx="5" ry="3" fill="#e88a7a" opacity="0.65"/>
      <circle cx="71" cy="191" r="2.4" fill="#e88a7a" opacity="0.65"/>
      <circle cx="80" cy="189" r="2.4" fill="#e88a7a" opacity="0.65"/>
      <circle cx="89" cy="191" r="2.4" fill="#e88a7a" opacity="0.65"/>
    </g>
    <g>
      <ellipse cx="144" cy="190" rx="22" ry="14" fill="#d9a55c"/>
      <ellipse cx="144" cy="194" rx="14" ry="7" fill="#f5d8a8"/>
      <ellipse cx="144" cy="195" rx="5" ry="3" fill="#e88a7a" opacity="0.65"/>
      <circle cx="135" cy="191" r="2.4" fill="#e88a7a" opacity="0.65"/>
      <circle cx="144" cy="189" r="2.4" fill="#e88a7a" opacity="0.65"/>
      <circle cx="153" cy="191" r="2.4" fill="#e88a7a" opacity="0.65"/>
    </g>

    <!-- Arms hugging body sides -->
    <ellipse cx="62" cy="160" rx="12" ry="22" fill="#d9a55c"/>
    <circle cx="62" cy="180" r="10" fill="#d9a55c"/>
    <circle cx="62" cy="181" r="6" fill="#f0a87a"/>
    <ellipse cx="162" cy="160" rx="12" ry="22" fill="#d9a55c"/>
    <circle cx="162" cy="180" r="10" fill="#d9a55c"/>
    <circle cx="162" cy="181" r="6" fill="#f0a87a"/>

    <!-- Mane fluff (back layer of bumps) -->
    <g fill="#c98f3d">
      <circle cx="62" cy="84" r="14"/>
      <circle cx="55" cy="115" r="14"/>
      <circle cx="78" cy="48" r="14"/>
      <circle cx="112" cy="38" r="14"/>
      <circle cx="146" cy="48" r="14"/>
      <circle cx="168" cy="80" r="14"/>
      <circle cx="172" cy="112" r="14"/>
      <circle cx="160" cy="140" r="14"/>
      <circle cx="78" cy="140" r="14"/>
    </g>

    <!-- Main mane disk -->
    <circle cx="112" cy="92" r="48" fill="#d9a55c"/>

    <!-- Face -->
    <circle cx="112" cy="102" r="34" fill="#f5d8a8"/>

    <!-- Ears -->
    <ellipse cx="86" cy="76" rx="10" ry="12" fill="#c98f3d"/>
    <ellipse cx="138" cy="76" rx="10" ry="12" fill="#c98f3d"/>
    <ellipse cx="86" cy="78" rx="5.5" ry="7.5" fill="#f0a87a"/>
    <ellipse cx="138" cy="78" rx="5.5" ry="7.5" fill="#f0a87a"/>

    <!-- Big plush eyes -->
    <ellipse cx="96" cy="102" rx="5.5" ry="7.5" fill="#2d2a26"/>
    <ellipse cx="128" cy="102" rx="5.5" ry="7.5" fill="#2d2a26"/>
    <circle cx="98" cy="99" r="2" fill="#fff"/>
    <circle cx="130" cy="99" r="2" fill="#fff"/>

    <!-- Cheek blush -->
    <ellipse cx="83" cy="118" rx="7" ry="3.5" fill="#e88a7a" opacity="0.5"/>
    <ellipse cx="141" cy="118" rx="7" ry="3.5" fill="#e88a7a" opacity="0.5"/>

    <!-- Nose -->
    <path d="M 104 117 Q 112 114 120 117 L 112 125 Z" fill="#2d2a26"/>

    <!-- Smile -->
    <path d="M 112 125 Q 106 131 100 129" stroke="#2d2a26" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M 112 125 Q 118 131 124 129" stroke="#2d2a26" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
